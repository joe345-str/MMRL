name: "Build APK"
description: "Builds an APK for a specified flavor and build type."

inputs:
  username:
    description: "Username"
    required: true
  token:
    description: "Token"
    required: true
  flavor:
    description: "Flavor"
    required: true
  buildType:
    description: "Build Type"
    required: true
  keyStore:
    description: "Key Store"
    required: true
  keyStorePassword:
    description: "Key Store Password"
    required: true
  keyAlias:
    description: "Key Alias"
    required: true
  keyPassword:
    description: "Key Password"
    required: true

outputs:
  name:
    value: ${{ steps.apk.outputs.name }}
    description: "The name of the APK file."

runs:
  using: "composite"
  steps:
    - name: Set environment variables
      shell: bash
      env:
        FLAVOR: ${{ inputs.flavor }}
        BUILD_TYPE: ${{ inputs.buildType }}
      run: |
        echo "FLAVOR_CAPITALIZED=${FLAVOR^}" >> $GITHUB_ENV
        echo "FLAVOR_CAPITALIZED_ALL=${FLAVOR^^}" >> $GITHUB_ENV
        echo "FLAVOR_LOWERCASE=${FLAVOR,,}" >> $GITHUB_ENV
        echo "BUILD_TYPE_CAPITALIZED=${BUILD_TYPE^}" >> $GITHUB_ENV
        echo "BUILD_TYPE_LOWERCASE=${BUILD_TYPE,,}" >> $GITHUB_ENV
        echo "BUILD_COMMAND=${FLAVOR^}${BUILD_TYPE^}" >> $GITHUB_ENV

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up signing key
      shell: bash
      env:
        KEY_STORE: ${{ inputs.keyStore }}
        KEY_STORE_PASSWORD: ${{ inputs.keyStorePassword }}
        KEY_ALIAS: ${{ inputs.keyAlias }}
        KEY_PASSWORD: ${{ inputs.keyPassword }}
        WORKSPACE: ${{ github.workspace }}
      run: |
        if [ -n "$KEY_STORE" ]; then
            echo keyStorePassword="$KEY_STORE_PASSWORD" >> signing.properties
            echo keyAlias="$KEY_ALIAS" >> signing.properties
            echo keyPassword="$KEY_PASSWORD" >> signing.properties
            echo keyStore="$WORKSPACE/key.jks" >> signing.properties
            echo "$KEY_STORE" | base64 --decode > "$WORKSPACE/key.jks"
        fi

    - name: Set up credentials for private packages
      shell: bash
      env:
        USERNAME: ${{ inputs.username }}
        TOKEN: ${{ inputs.token }}
      run: |
        [ -f gradle.properties ] && [ "$(tail -c1 gradle.properties)" != "" ] && echo >> gradle.properties
        {
          echo "gpr.user=$USERNAME"
          echo "gpr.key=$TOKEN"
        } >> gradle.properties

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: "zulu"
        java-version: 21

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: true

    - name: Build APK
      shell: bash
      run: chmod +x ./gradlew && ./gradlew assemble${{ env.BUILD_COMMAND }}

    - name: Get APK output
      id: apk
      shell: bash
      run: |
        apk_path=$(find app/build/outputs/apk/${{ env.FLAVOR_LOWERCASE }}/${{ env.BUILD_TYPE_LOWERCASE }} -name "*.apk" -print -quit)
        mapping_path=$(find app/build/outputs/mapping/${{ env.FLAVOR_LOWERCASE }}${{ env.BUILD_TYPE_CAPITALIZED }} -name "mapping.txt" -print -quit)
        name=$(basename "$apk_path" .apk)

        echo "name=$name" >> $GITHUB_OUTPUT
        echo "path=$apk_path" >> $GITHUB_OUTPUT
        echo "mapping=$mapping_path" >> $GITHUB_OUTPUT

    - name: Upload mapping as artifact
      if: ${{ steps.apk.outputs.mapping != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.flavor }}-${{ inputs.buildType }}-mapping
        path: ${{ steps.apk.outputs.mapping }}

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.flavor }}-${{ inputs.buildType }}-apk
        path: ${{ steps.apk.outputs.path }}
